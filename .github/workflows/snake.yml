name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: output
      - name: Generate snake.svg (light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: riorizqi-dev
          outputs: |
            output/snake-light.svg?color_snake=#7C3AED&color_dots=#ebedf0,#d8b4fe,#c084fc,#a855f7,#7c3aed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate snake.svg (dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: riorizqi-dev
          outputs: |
            output/snake-dark.svg?color_snake=#A78BFA&color_dots=#161B22,#3b0764,#581c87,#7e22ce,#a21caf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit & push
        run: |
          git config user.name "riorizqi-dev"
          git config user.email "riorizqi918@gmail.com"
          git add output/snake-*.svg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update contribution snake"
            git push origin output
          fi
