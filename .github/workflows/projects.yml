name: Generate projects.svg

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_projects.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate projects SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_projects.py "${{ github.repository_owner }}" "$GITHUB_TOKEN"

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects-dark.svg projects-light.svg
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: regenerate projects.svg from GitHub API"
            git push
          fi
