<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-label="See you around">
  <title>See you around</title>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans JP', sans-serif; }
      .wave { animation: wave 2.4s ease-in-out infinite; transform-origin: 856px 62px; transform-box: view-box; }
      @keyframes wave { 0%,60%,100% { transform: rotate(0); } 10%,30% { transform: rotate(14deg); } 20%,40% { transform: rotate(-8deg); } }
    </style>
  </defs>
  <rect width="1200" height="110" rx="22" fill="#1a1b27"/>
  <rect x="0.5" y="0.5" width="1199" height="109" rx="22" fill="none" stroke="#7aa2f7" stroke-opacity="0.25"/>
  <rect x="150" y="18" width="900" height="2" fill="url(#line)"/>
  <text x="600" y="70" text-anchor="middle" class="sans" font-size="26" font-weight="600" fill="#c0caf5">またね<tspan fill="#565f89">  ·  </tspan>Sampai jumpa<tspan fill="#565f89">  ·  </tspan>See you around 👋</text>
</svg>
