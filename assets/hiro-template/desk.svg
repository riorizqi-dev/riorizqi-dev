<svg xmlns="http://www.w3.org/2000/svg" width="360" height="290" viewBox="0 0 360 290" role="img" aria-label="A cozy coding desk">
  <title>A cozy coding desk</title>
  <defs>
    <clipPath id="card"><rect width="360" height="290" rx="20"/></clipPath>
    <clipPath id="screen"><rect x="106" y="62" width="148" height="96" rx="4"/></clipPath>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1b27"/><stop offset="1" stop-color="#16161e"/></linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1018"/><stop offset="1" stop-color="#2a2342"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7aa2f7" stop-opacity=".35"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/></radialGradient>
    <radialGradient id="lamp" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#e0af68" stop-opacity=".35"/><stop offset="1" stop-color="#e0af68" stop-opacity="0"/></radialGradient>
    <style>
      .scroll { animation: scroll 9s linear infinite; }
      @keyframes scroll { from { transform: translateY(0); } to { transform: translateY(-176px); } }
      .cursor { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
      .key { animation: key 1.2s steps(1) infinite; }
      @keyframes key { 0%,85% { fill: #414868; } 86%,100% { fill: #7aa2f7; } }
      .steam { animation: steam 3s ease-in-out infinite; } .st2 { animation-delay: 1.5s; }
      @keyframes steam { 0% { transform: translateY(4px); opacity: 0; } 40% { opacity: .8; } 100% { transform: translateY(-16px); opacity: 0; } }
      .tail { animation: tail 2.6s ease-in-out infinite; transform-origin: 62px 238px; }
      @keyframes tail { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-14deg); } }
      .breathe { animation: breathe 3.2s ease-in-out infinite; transform-origin: 70px 246px; }
      @keyframes breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.05); } }
      .z { animation: z 3.6s ease-out infinite; opacity: 0; } .z2 { animation-delay: 1.2s; } .z3 { animation-delay: 2.4s; }
      @keyframes z { 0% { transform: translate(0,0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(14px,-26px); opacity: 0; } }
      .leaf { animation: sway 4s ease-in-out infinite; transform-origin: 318px 214px; }
      @keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
      .tw { animation: tw 2.4s ease-in-out infinite; } .tw2 { animation-delay: 1.2s; }
      @keyframes tw { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
      .screenglow { animation: sg 4s ease-in-out infinite; }
      @keyframes sg { 0%,100% { opacity: .8; } 50% { opacity: 1; } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="360" height="290" fill="url(#wall)"/>

    <!-- window -->
    <rect x="22" y="22" width="70" height="86" rx="6" fill="url(#night)" stroke="#414868" stroke-width="3"/>
    <line x1="57" y1="22" x2="57" y2="108" stroke="#414868" stroke-width="3"/>
    <line x1="22" y1="65" x2="92" y2="65" stroke="#414868" stroke-width="3"/>
    <circle cx="76" cy="40" r="9" fill="#e9ecff"/><circle cx="80" cy="37" r="8" fill="#1a1b2e"/>
    <circle class="tw" cx="34" cy="36" r="1.5" fill="#c0caf5"/><circle class="tw tw2" cx="44" cy="82" r="1.5" fill="#c0caf5"/><circle class="tw" cx="80" cy="92" r="1.2" fill="#c0caf5"/>

    <!-- string lights -->
    <path d="M110 18 Q200 42 340 16" fill="none" stroke="#414868" stroke-width="1.5"/>
    <circle class="tw" cx="120" cy="26" r="3.2" fill="#7aa2f7"/><circle class="tw tw2" cx="146" cy="26" r="3.2" fill="#bb9af7"/><circle class="tw" cx="172" cy="26" r="3.2" fill="#9ece6a"/><circle class="tw tw2" cx="198" cy="30" r="3.2" fill="#e0af68"/><circle class="tw" cx="224" cy="30" r="3.2" fill="#7dcfff"/><circle class="tw tw2" cx="250" cy="30" r="3.2" fill="#f7768e"/><circle class="tw" cx="276" cy="30" r="3.2" fill="#7aa2f7"/><circle class="tw tw2" cx="302" cy="26" r="3.2" fill="#bb9af7"/><circle class="tw" cx="328" cy="26" r="3.2" fill="#9ece6a"/>

