" fill="#414868" style="animation-delay:1.66s"/><rect class="key" x="207" y="229" width="9" height="5" rx="1.5" fill="#414868" style="animation-delay:0.56s"/><rect class="key" x="218" y="229" width="9" height="5" rx="1.5" fill="#414868" style="animation-delay:1.07s"/><rect x="229" y="229" width="9" height="5" rx="1.5" fill="#414868" style="animation-delay:0.64s"/><rect class="key" x="240" y="229" width="9" height="5" rx="1.5" fill="#414868" style="animation-delay:1.72s"/><rect x="122" y="236" width="9" height="5" rx="1.5" fill="#414868" style="animation-delay:1.31s"/><rect x="133" y="236" width="9" height="5" rx="1.5" fill="#414868" style="animation-delay:0.91s"/><rect x="144" y="236" width="9" height="5" rx="1.5" fill="#414868" style="animation-delay:1.90s"/><rect x="155" y="236" width="9" height="5" rx="1.5" fill="#414868" style="animation-delay:1.12s"/><rect class="key" x="166" y="236" width="9" height="5" rx="1.5" fill="#414868" style="animation-delay:0.79s"/><rect x="177" y="236" width="9" height="5" rx="1.5" fill="#414868" style="animation-delay:0.80s"/><rect class="key" x="188" y="236" width="9" height="5" rx="1.5" fill="#414868" style="animation-delay:1.97s"/><rect x="199" y="236" width="9" height="5" rx="1.5" fill="#414868" style="animation-delay:0.22s"/><rect x="210" y="236" width="9" height="5" rx="1.5" fill="#414868" style="animation-delay:0.20s"/><rect x="221" y="236" width="9" height="5" rx="1.5" fill="#414868" style="animation-delay:1.07s"/><rect x="232" y="236" width="9" height="5" rx="1.5" fill="#414868" style="animation-delay:1.23s"/><rect class="key" x="243" y="236" width="9" height="5" rx="1.5" fill="#414868" style="animation-delay:0.42s"/>

    <!-- coffee -->
