33" height="5" rx="2.5" fill="#7dcfff" fill-opacity=".85"/><rect x="184" y="308" width="45" height="5" rx="2.5" fill="#9ece6a" fill-opacity=".85"/><rect x="132" y="319" width="18" height="5" rx="2.5" fill="#7aa2f7" fill-opacity=".85"/><rect x="155" y="319" width="46" height="5" rx="2.5" fill="#e0af68" fill-opacity=".85"/><rect x="112" y="330" width="23" height="5" rx="2.5" fill="#e0af68" fill-opacity=".85"/><rect x="140" y="330" width="40" height="5" rx="2.5" fill="#7aa2f7" fill-opacity=".85"/><rect x="112" y="341" width="34" height="5" rx="2.5" fill="#9ece6a" fill-opacity=".85"/><rect x="151" y="341" width="36" height="5" rx="2.5" fill="#7dcfff" fill-opacity=".85"/><rect x="192" y="341" width="45" height="5" rx="2.5" fill="#7dcfff" fill-opacity=".85"/></g>
