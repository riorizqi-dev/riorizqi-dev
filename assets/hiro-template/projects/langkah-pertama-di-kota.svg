<svg xmlns="http://www.w3.org/2000/svg" width="390" height="222" viewBox="0 0 390 222" role="img" aria-label="Langkah Pertama di Kota">
  <title>Langkah Pertama di Kota</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ece6a"/><stop offset="1" stop-color="#7dcfff"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9ece6a" stop-opacity=".28"/><stop offset="1" stop-color="#9ece6a" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="390" height="222" rx="18"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans JP', sans-serif; } .mono { font-family: 'SFMono-Regular', 'JetBrains Mono', Consolas, Menlo, monospace; }
      .blink { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
      .star { animation: twinkle 3s ease-in-out infinite; }
      .s2 { animation-delay: .8s; } .s3 { animation-delay: 1.6s; } .s4 { animation-delay: 2.2s; }
      @keyframes twinkle { 0%,100% { opacity: .9; } 50% { opacity: .15; } }
      .pulse { animation: pulse 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(2.8); opacity: 0; } }

      .shine { animation: shine 6s ease-in-out infinite; }
      @keyframes shine { 0% { transform: translateX(-260px) skewX(-20deg); } 40%,100% { transform: translateX(550px) skewX(-20deg); } }
      .bob { animation: bob 3.5s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="390" height="222" fill="#1a1b27"/>
    <circle cx="350" cy="10" r="150" fill="url(#gl)"><animate attributeName="r" values="130;165;130" dur="6s" repeatCount="indefinite"/></circle>
    <rect class="shine" x="0" y="0" width="180" height="222" fill="url(#shine)"/>
    <rect width="390" height="4" fill="url(#g)"/>
    <g class="bob"><rect x="24" y="24" width="50" height="50" rx="14" fill="url(#g)"/><text x="49" y="59" text-anchor="middle" font-size="25">🍅</text></g>
    <text x="92" y="48" class="sans" font-size="24" font-weight="800" fill="#c0caf5">Langkah Pertama di Kota</text>
    <rect x="92" y="60" width="121" height="22" rx="11" fill="#e0af68" fill-opacity=".12" stroke="#e0af68" stroke-opacity=".45"/>
    <circle class="pulse" cx="106" cy="71" r="3.5" fill="#e0af68"/><circle cx="106" cy="71" r="3.5" fill="#e0af68"/>
    <text x="116" y="75" class="sans" font-size="10" font-weight="700" letter-spacing="1" fill="#e0af68">PUBLIC</text>
    <text x="24" y="124" class="sans" font-size="15.5" fill="#a9b1d6">RPG slice of life dengan</text><text x="24" y="147" class="sans" font-size="15.5" fill="#a9b1d6">visual 2D bergaya pixel art.</text><rect x="24" y="172" width="96" height="26" rx="13" fill="#9ece6a" fill-opacity=".12" stroke="#9ece6a" stroke-opacity=".4"/><text x="72.0" y="189.5" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#9ece6a">Godot 4</text><rect x="127" y="172" width="59" height="26" rx="13" fill="#9ece6a" fill-opacity=".12" stroke="#9ece6a" stroke-opacity=".4"/><text x="156.5" y="189.5" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#9ece6a">2D</text><rect x="193" y="172" width="88" height="26" rx="13" fill="#9ece6a" fill-opacity=".12" stroke="#9ece6a" stroke-opacity=".4"/><text x="237.0" y="189.5" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#9ece6a">Pixel art</text>
  </g>
  <rect x=".5" y=".5" width="389" height="221" rx="18" fill="none" stroke="#9ece6a" stroke-opacity=".3"/>
</svg>
