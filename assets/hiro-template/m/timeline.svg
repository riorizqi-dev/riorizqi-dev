<svg xmlns="http://www.w3.org/2000/svg" width="480" height="630" viewBox="0 0 480 630" role="img" aria-label="Journey">
  <title>Journey</title>
  <defs>
    <linearGradient id="ln" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="560">
      <stop offset="0" stop-color="#7aa2f7"/><stop offset=".25" stop-color="#9ece6a"/><stop offset=".5" stop-color="#5edcaa"/>
      <stop offset=".7" stop-color="#9a6bff"/><stop offset=".85" stop-color="#3ddc6b"/><stop offset="1" stop-color="#f7768e"/>
    </linearGradient>
    <clipPath id="c"><rect width="480" height="630" rx="20"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans JP', sans-serif; } .mono { font-family: 'SFMono-Regular', 'JetBrains Mono', Consolas, Menlo, monospace; }
      .blink { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
      .star { animation: twinkle 3s ease-in-out infinite; }
      .s2 { animation-delay: .8s; } .s3 { animation-delay: 1.6s; } .s4 { animation-delay: 2.2s; }
      @keyframes twinkle { 0%,100% { opacity: .9; } 50% { opacity: .15; } }
      .pulse { animation: pulse 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(2.8); opacity: 0; } }

      .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s ease-out .2s forwards; } @keyframes draw { to { stroke-dashoffset: 0; } }
      .pop { animation: pop .5s cubic-bezier(.3,1.6,.5,1) backwards; transform-box: fill-box; transform-origin: center; }
      @keyframes pop { from { opacity: 0; transform: translateX(-10px); } }
      .spin { animation: spin 8s linear infinite; transform-box: fill-box; transform-origin: center; } @keyframes spin { to { transform: rotate(360deg); } }
      .run { animation: run 6s ease-in-out infinite; }
      @keyframes run { 0% { transform: translateY(0); opacity: 0; } 8%,92% { opacity: 1; } 100% { transform: translateY(460px); opacity: 0; } }
    </style>
  </defs>
