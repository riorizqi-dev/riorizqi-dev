      <text x="104" y="314" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="14" fill="#a9b1d6">motion landing page</text></g><g class="pop" style="animation-delay:1.20s"><circle class="pulse" style="animation-delay:1.60s" cx="60" cy="376" r="22" fill="#9a6bff" fill-opacity=".25"/>
      <circle cx="60" cy="376" r="22" fill="#1a1b27" stroke="#9a6bff" stroke-width="2.5"/>
      <text x="60" y="383" text-anchor="middle" font-size="20">🐾</text>
