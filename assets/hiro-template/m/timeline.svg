      <text x="104" y="384" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="19" font-weight="700" fill="#c0caf5">TaskTrack</text>
      <text x="104" y="406" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="14" fill="#a9b1d6">Android · Kotlin</text></g><g class="pop" style="animation-delay:1.50s"><circle class="pulse" style="animation-delay:1.90s" cx="60" cy="468" r="22" fill="#3ddc6b" fill-opacity=".25"/>
