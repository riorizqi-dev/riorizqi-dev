      <text x="104" y="498" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="14" fill="#a9b1d6">RPG pixel art</text></g><g class="pop" style="animation-delay:1.80s"><circle cx="60" cy="560" r="24" fill="none" stroke="#f7768e" stroke-width="2" stroke-dasharray="4 5" class="spin"/>
