<svg xmlns="http://www.w3.org/2000/svg" width="480" height="690" viewBox="0 0 480 690" role="img" aria-label="Rio Rizqi Saputra">
  <title>Rio Rizqi Saputra</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1b27"/><stop offset="1" stop-color="#13141c"/></linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/><stop offset=".35" stop-color="#bb9af7"/><stop offset=".65" stop-color="#f7768e"/><stop offset="1" stop-color="#7aa2f7"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="eq" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7aa2f7"/><stop offset="1" stop-color="#bb9af7"/></linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bb9af7"/><stop offset="1" stop-color="#f7768e"/></linearGradient>
    <radialGradient id="gb" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7aa2f7" stop-opacity=".35"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/></radialGradient>
    <radialGradient id="gp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#bb9af7" stop-opacity=".3"/><stop offset="1" stop-color="#bb9af7" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a9b1d6" stroke-opacity=".05"/></pattern>
    <clipPath id="c"><rect width="480" height="690" rx="22"/></clipPath>
    <clipPath id="typed"><rect x="255" y="80" height="30" width="0"><animate attributeName="width" values="0;0;68;68;0" keyTimes="0;.08;.3;.85;1" dur="7s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="prog"><rect x="108" y="670" height="4" width="0"><animate attributeName="width" values="0;250" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans', 'Noto Sans JP', sans-serif; } .mono { font-family: 'SFMono-Regular', 'JetBrains Mono', Consolas, Menlo, monospace; }
      .blink { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
      .star { animation: twinkle 3s ease-in-out infinite; }
      .s2 { animation-delay: .8s; } .s3 { animation-delay: 1.6s; } .s4 { animation-delay: 2.2s; }
      @keyframes twinkle { 0%,100% { opacity: .9; } 50% { opacity: .15; } }
      .pulse { animation: pulse 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(2.8); opacity: 0; } }

      .float { animation: float 5s ease-in-out infinite; }
      .f1 { animation-delay: .4s; } .f2 { animation-delay: .8s; } .f3 { animation-delay: 1.2s; } .f4 { animation-delay: 1.6s; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      .l1 { animation: l1 8s infinite; } .l2 { animation: l2 8s infinite; } .l3 { animation: l3 8s infinite; } .l4 { animation: l4 8s infinite; }
      @keyframes l1 { 0%,92% { opacity: 1; } 96%,100% { opacity: 0; } }
      @keyframes l2 { 0%,22% { opacity: 0; } 24%,92% { opacity: 1; } 96%,100% { opacity: 0; } }
      @keyframes l3 { 0%,40% { opacity: 0; } 42%,92% { opacity: 1; } 96%,100% { opacity: 0; } }
      @keyframes l4 { 0%,60% { opacity: 0; } 62%,92% { opacity: 1; } 96%,100% { opacity: 0; } }
      .bar { transform-box: fill-box; transform-origin: bottom; animation: eq 1s ease-in-out infinite; }
      .b2 { animation-duration: .8s; animation-delay: .2s; } .b3 { animation-duration: 1.2s; animation-delay: .1s; }
      .b4 { animation-duration: .9s; animation-delay: .35s; } .b5 { animation-duration: 1.1s; animation-delay: .05s; }
      @keyframes eq { 0%,100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
      .spin { animation: spin 6s linear infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </defs>
  <g clip-path="url(#c)">
