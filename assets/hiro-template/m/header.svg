    <circle cx="420" cy="80" r="220" fill="url(#gb)"><animate attributeName="cy" values="80;140;80" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="380" r="200" fill="url(#gp)"><animate attributeName="cx" values="40;120;40" dur="14s" repeatCount="indefinite"/></circle>
    <text x="464" y="270" text-anchor="end" class="sans" font-size="170" font-weight="700" fill="#c0caf5" fill-opacity=".04">RR</text>
    <g fill="#c0caf5"><circle class="star" cx="380" cy="40" r="2"/><circle class="star s2" cx="440" cy="120" r="1.5"/><circle class="star s3" cx="330" cy="150" r="1.5"/><circle class="star s4" cx="450" cy="250" r="2"/></g>
    <circle cx="36" cy="34" r="7" fill="#f7768e"/><circle cx="60" cy="34" r="7" fill="#e0af68"/><circle cx="84" cy="34" r="7" fill="#9ece6a"/>
    <rect x="108" y="20" width="200" height="28" rx="14" fill="#9ece6a" fill-opacity=".1" stroke="#9ece6a" stroke-opacity=".35"/>
    <circle class="pulse" cx="125" cy="34" r="5" fill="#9ece6a"/><circle cx="125" cy="34" r="5" fill="#9ece6a"/>
    <text x="138" y="39" class="sans" font-size="13" font-weight="600" fill="#9ece6a">featured · Kantinku</text>
    <text x="28" y="100" class="mono" font-size="18"><tspan fill="#9ece6a">rio@github</tspan><tspan fill="#565f89">:</tspan><tspan fill="#7aa2f7">~</tspan><tspan fill="#bb9af7"> ❯ </tspan></text>
    <text x="255" y="100" class="mono" font-size="18" fill="#c0caf5" clip-path="url(#typed)">whoami</text>
    <rect class="blink" x="257" y="85" width="10" height="19" fill="#c0caf5"><animate attributeName="x" values="257;257;325;325;257" keyTimes="0;.08;.3;.85;1" dur="7s" repeatCount="indefinite"/></rect>
    <text x="24" y="178" class="sans" font-size="64" font-weight="800" letter-spacing="-1.5" fill="url(#name)">Rio Rizqi</text>
    <text x="24" y="242" class="sans" font-size="64" font-weight="800" letter-spacing="-1.5" fill="url(#name)">Saputra</text>
    <text x="28" y="278" class="sans" font-size="19" fill="#a9b1d6"><tspan fill="#c0caf5" font-weight="600">@riorizqi-dev</tspan><tspan fill="#565f89">  ·  </tspan>Web · Android · Pixel art</text>
    <g class="float f0"><rect x="28" y="296" width="116" height="34" rx="17" fill="#7aa2f7" fill-opacity=".14" stroke="#7aa2f7" stroke-opacity=".5"/><text x="86.0" y="318" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#7aa2f7">TypeScript</text></g><g class="float f1"><rect x="154" y="296" width="80" height="34" rx="17" fill="#9ece6a" fill-opacity=".14" stroke="#9ece6a" stroke-opacity=".5"/><text x="194.0" y="318" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#9ece6a">Kotlin</text></g><g class="float f2"><rect x="244" y="296" width="112" height="34" rx="17" fill="#bb9af7" fill-opacity=".14" stroke="#bb9af7" stroke-opacity=".5"/><text x="300.0" y="318" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#bb9af7">Godot</text></g><g class="float f3"><rect x="28" y="340" width="108" height="34" rx="17" fill="#e0af68" fill-opacity=".14" stroke="#e0af68" stroke-opacity=".5"/><text x="82.0" y="362" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#e0af68">Next.js</text></g><g class="float f4"><rect x="146" y="340" width="130" height="34" rx="17" fill="#f7768e" fill-opacity=".14" stroke="#f7768e" stroke-opacity=".5"/><text x="211.0" y="362" text-anchor="middle" class="sans" font-size="15" font-weight="600" fill="#f7768e">Pixel Art</text></g>
    <rect x="24" y="404" width="432" height="150" rx="14" fill="#16161e" fill-opacity=".92" stroke="#7aa2f7" stroke-opacity=".3"/>
    <path d="M24 418 a14 14 0 0 1 14 -14 h404 a14 14 0 0 1 14 14 v14 h-432 z" fill="#1f2335"/>
    <circle cx="42" cy="418" r="4.5" fill="#f7768e"/><circle cx="58" cy="418" r="4.5" fill="#e0af68"/><circle cx="74" cy="418" r="4.5" fill="#9ece6a"/>
    <text x="260.0" y="423" text-anchor="middle" class="mono" font-size="12" fill="#565f89">~/kantinku — terminal</text>
    <g class="mono" font-size="14">
      <text class="l1" x="40" y="460"><tspan fill="#bb9af7">❯ </tspan><tspan fill="#c0caf5">git log --oneline</tspan></text>
      <text class="l2" x="40" y="486"><tspan fill="#7aa2f7">● </tspan><tspan fill="#a9b1d6">Pemesanan kantin</tspan></text>
      <text class="l3" x="40" y="512"><tspan fill="#e0af68">● </tspan><tspan fill="#a9b1d6">Stok real-time</tspan><tspan fill="#9ece6a"></tspan><tspan fill="#f7768e"></tspan></text>
      <text class="l4" x="40" y="538"><tspan fill="#9ece6a">✓ Next.js + Supabase</tspan></text>
    </g>
    <rect x="24" y="570" width="432" height="104" rx="14" fill="#16161e" fill-opacity=".92" stroke="#bb9af7" stroke-opacity=".3"/>
    <rect x="40" y="586" width="54" height="54" rx="10" fill="url(#cover)"/>
    <circle class="spin" cx="67" cy="613" r="16" fill="none" stroke="#1a1b27" stroke-opacity=".6" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="67" y="620" text-anchor="middle" font-size="20" fill="#1a1b27">♪</text>
    <text x="108" y="602" class="sans" font-size="12" font-weight="700" letter-spacing="1.5" fill="#bb9af7">PROJECT SPOTLIGHT</text>
    <text x="108" y="625" class="sans" font-size="17" font-weight="600" fill="#c0caf5">Langkah Pertama di Kota</text>
    <text x="108" y="644" class="sans" font-size="13" fill="#565f89">Godot 4 · Pixel art</text>
    <rect x="108" y="652" width="250" height="4" rx="2" fill="#2a2e42"/>
    <rect x="108" y="652" width="250" height="4" rx="2" fill="#bb9af7" clip-path="url(#prog)"/>
    <g fill="url(#eq)"><rect class="bar b1" x="392" y="588" width="6" height="40" rx="3"/><rect class="bar b2" x="402" y="588" width="6" height="40" rx="3"/><rect class="bar b3" x="412" y="588" width="6" height="40" rx="3"/><rect class="bar b4" x="422" y="588" width="6" height="40" rx="3"/><rect class="bar b5" x="432" y="588" width="6" height="40" rx="3"/></g>
  </g>
  <rect x=".5" y=".5" width="479" height="689" rx="22" fill="none" stroke="#7aa2f7" stroke-opacity=".25"/>
